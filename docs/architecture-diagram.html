<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RAG App Architecture Diagram</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #10203f;
        background: #f5f7fb;
      }

      body {
        margin: 0;
        min-height: 100vh;
      }

      main {
        box-sizing: border-box;
        max-width: 1280px;
        margin: 0 auto;
        padding: 32px 20px;
      }

      h1 {
        margin: 0 0 18px;
        font-size: clamp(1.5rem, 2vw, 2.25rem);
        font-weight: 750;
        letter-spacing: 0;
      }

      figure {
        margin: 0;
        padding: 18px;
        border: 1px solid #d9e2f1;
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 18px 45px rgba(16, 32, 63, 0.08);
      }

      img {
        display: block;
        width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>RAG App Architecture</h1>
      <figure>
        <img src="./assets/architecture-diagram.png" alt="Architecture diagram for the RAG application">
      </figure>
    </main>
  </body>
</html>
